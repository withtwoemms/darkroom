name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        run: uvx ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git history and tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Test with coverage (Python ${{ matrix.python }})
        run: make test PYTHON=${{ matrix.python }}
      - name: Upload coverage report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install OpenBao
        run: |
          curl -sSL -o /tmp/bao.deb https://github.com/openbao/openbao/releases/download/v2.3.1/bao_2.3.1_linux_amd64.deb
          sudo dpkg -i /tmp/bao.deb
          bao --version
      - name: Backend tests against a real dev server
        run: |
          make install
          UV_PROJECT_ENVIRONMENT=.darkroom-3.12 uv run --python 3.12 -m pytest tests/integration/test_openbao.py -q

  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install chromium
        run: |
          make install
          UV_PROJECT_ENVIRONMENT=.darkroom-3.12 uv run --python 3.12 playwright install --with-deps chromium
      - name: Browser drive tests against real chromium
        run: |
          UV_PROJECT_ENVIRONMENT=.darkroom-3.12 uv run --python 3.12 -m pytest tests/integration/test_browser_drive.py -q
      - name: Record the example screencast
        run: |
          cp -r examples/relay-service /tmp/relay-service
          cd /tmp/relay-service
          UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.darkroom-3.12 uv run --python 3.12 --project $GITHUB_WORKSPACE \
            darkroom drive --drives drives-ui --scenario notes_page
      - name: Upload the example screencast
        uses: actions/upload-artifact@v4
        with:
          name: example-screencast
          path: /tmp/relay-service/evidence/runs/*/notes_page/*.webm
          if-no-files-found: error
