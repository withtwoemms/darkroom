scenario = "note_lifecycle"

[[step]]
name = "create"
method = "POST"
url = "{base_url}/notes"
json = { text = "develop the print" }
expect = { status = 201 }
save = { note_id = "$.id", token = "$.token" }

[[step]]
name = "fetch_hides_token"
url = "{base_url}/notes/{note_id}"
expect = { status = 200, body_contains = "develop the print" }

[[step]]
name = "archive"
method = "POST"
url = "{base_url}/notes/{note_id}/archive"
expect = { status = 200, body_contains = "true" }

[[step]]
name = "archive_again_idempotent"
method = "POST"
url = "{base_url}/notes/{note_id}/archive"
expect = { status = 200, body_contains = "true" }
